<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AIR-HANZI VLOG CAM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <style>
        body { background-color: #000; color: #fff; font-family: 'Arial Black', Impact, sans-serif; overscroll-behavior: none; touch-action: none; margin: 0; padding: 0; }
        .screen { display: none; position: absolute; inset: 0; width: 100%; height: 100%; z-index: 10; }
        .screen.active { display: flex; }
        .text-stroke { text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0px 4px 10px rgba(0,0,0,0.8); }
        .snap-btn { background: rgba(255, 255, 255, 0.95); color: #000; border-radius: 9999px; font-weight: 900; text-transform: uppercase; box-shadow: 0 10px 25px rgba(0,0,0,0.5); cursor: pointer; border: none; transition: transform 0.1s; }
        .snap-btn:active { transform: scale(0.95); }
        .snap-btn.red { background: #FF3366; color: #fff; }
        .snap-btn.yellow { background: #FFEA00; color: #000; }
        .offscreen { position: absolute; top: -9999px; left: -9999px; opacity: 0; pointer-events: none; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }
        .shake-anim { animation: shake 0.5s ease-in-out infinite; }
    </style>
</head>
<body class="h-[100dvh] w-screen overflow-hidden relative bg-black">
    <video id="input_video" class="hidden" autoplay playsinline muted></video>
    <canvas id="draw_layer" class="hidden"></canvas>
    <div id="hw-container" class="offscreen"></div>
    <canvas id="display_canvas" class="absolute inset-0 w-full h-full object-cover z-0"></canvas>

    <!-- 首屏：难度选择 -->
    <div id="screen-start" class="screen active flex-col items-center justify-center bg-black/90 backdrop-blur-md px-6 text-center z-50">
        <h1 class="text-6xl font-black mb-2 text-stroke text-yellow-300">AIR-HANZI</h1>
        <p class="text-md font-bold mb-8 text-white max-w-xs opacity-80">Test your Chinese drawing skills in the air.</p>
        
        <div id="difficulty-buttons" class="flex flex-col gap-4 w-full max-w-sm">
            <button onclick="selectDifficulty('easy')" class="snap-btn px-6 py-4 text-xl w-full border-4 border-black">👶 EASY MODE</button>
            <button onclick="selectDifficulty('medium')" class="snap-btn yellow px-6 py-4 text-xl w-full border-4 border-black">😎 MEDIUM</button>
            <button onclick="selectDifficulty('hell')" class="snap-btn red px-6 py-4 text-2xl w-full border-4 border-white shake-anim">💀 HELL MODE</button>
        </div>

        <p id="loading-text" class="hidden mt-6 font-bold text-yellow-300 animate-pulse text-xl">WAKING UP AI... SHOW YOUR HAND</p>
    </div>

    <!-- 游戏界面 HUD：极其干净 -->
    <div id="screen-hud" class="screen flex-col items-center justify-between py-12 px-0 pointer-events-none">
        <div class="flex justify-between w-full items-start px-4">
            <div id="rec-indicator" class="text-red-500 font-bold flex items-center gap-2 bg-black/50 px-3 py-1 rounded-full text-sm"><div class="w-3 h-3 bg-red-500 rounded-full animate-pulse"></div> REC</div>
        </div>
        
        <!-- 顶部的胶囊指示器 -->
        <div id="pinch-status" class="hidden absolute top-16 left-1/2 transform -translate-x-1/2 bg-black/60 text-white px-5 py-2 rounded-full font-black text-lg z-50 backdrop-blur-sm transition-colors duration-200">
            🤏 PINCH TO DRAW
        </div>

        <!-- 底部的动作栏：分开放在左右 -->
        <div id="action-bar" class="hidden absolute bottom-12 left-0 w-full px-6 flex justify-between items-center z-50 pointer-events-auto">
            <button onclick="retryCurrentLevel()" class="bg-black/60 text-white border-2 border-white/50 px-5 py-3 rounded-full font-bold backdrop-blur-sm shadow-lg active:scale-95 transition-all flex items-center gap-2">
                <span class="text-xl">🔄</span> RETRY
            </button>
            <button onclick="finishDrawingEarly()" class="bg-[#FFEA00] text-black border-4 border-black px-8 py-4 rounded-full font-black text-xl shadow-[0_6px_0_0_#000] active:translate-y-1 active:shadow-none transition-all">
                ✅ I'M DONE
            </button>
        </div>
    </div>

    <!-- 结果页面 -->
    <div id="screen-result" class="screen flex-col items-center justify-between bg-black z-50">
        <video id="replay-video" class="absolute inset-0 w-full h-full object-cover z-0" controls loop playsinline></video>
        <div class="absolute top-0 w-full h-32 bg-gradient-to-b from-black/80 to-transparent z-10 pointer-events-none"></div>
        <div class="absolute bottom-0 w-full h-64 bg-gradient-to-t from-black/90 to-transparent z-10 pointer-events-none"></div>
        
        <div class="z-20 w-full pt-12 px-4 flex justify-center items-center pointer-events-none"></div>
        
        <div class="z-20 w-full pb-10 px-4 flex flex-col gap-4 max-w-md mx-auto">
            <button id="btn-share" onclick="shareVideo()" class="snap-btn px-6 py-4 w-full flex flex-col items-center text-center"><span class="text-2xl">🚀 SHARE VIDEO</span></button>
            <button onclick="location.reload()" class="snap-btn yellow px-6 py-4 w-full flex flex-col items-center text-center border-2 border-black"><span class="text-xl">🔄 PLAY AGAIN</span></button>
        </div>
    </div>

    <script>
        const hanziDict = {
            easy:[ {char: '一', hint: "Literally just a line."}, {char: '人', hint: "Two legs walking."}, {char: '口', hint: "Just draw a box."}, {char: '山', hint: "Three little peaks."}, {char: '心', hint: "Not your typical ❤️."}, {char: '门', hint: "Looks like a saloon door."}, {char: '水', hint: "Splashing drops."}, {char: '木', hint: "A cross with roots."}, {char: '日', hint: "A window?"}, {char: '月', hint: "A crescent."}, {char: '飞', hint: "Like a bird wing."}, {char: '刀', hint: "Sharp edge."} ],
            medium:[ {char: '爱', hint: "Complicated, like your ex."}, {char: '钱', hint: "Cash rules everything."}, {char: '龙', hint: "The legendary beast."}, {char: '猫', hint: "A furry little beast."}, {char: '狗', hint: "Man's best friend."}, {char: '死', hint: "The Grim Reaper."}, {char: '鬼', hint: "Spooky spirit."}, {char: '火', hint: "Burn it down!"}, {char: '气', hint: "Dragon Ball stuff."}, {char: '屎', hint: "Yes, draw poop."}, {char: '杀', hint: "Ninja mode."}, {char: '痛', hint: "What your hand feels now."}, {char: '神', hint: "Divine power."}, {char: '猪', hint: "Oink oink."}, {char: '男', hint: "Field + Power."} ],
            hell:[ {char: '魔', hint: "21 strokes of pure evil."}, {char: '舞', hint: "Legs and arms everywhere!"}, {char: '赢', hint: "You won't win this."}, {char: '爆', hint: "Your brain right now."}, {char: '龟', hint: "Draw a literal turtle."}, {char: '蠢', hint: "Two bugs acting silly."}, {char: '繁', hint: "The definition of this game."}, {char: '鹰', hint: "A majestic mess."}, {char: '藏', hint: "Too many layers."}, {char: '懒', hint: "Too many lines for a lazy person."}, {char: '憋', hint: "Like holding your pee."}, {char: '霸', hint: "Overwhelming power."} ]
        };

        let currentDifficulty = null;
        let targetWord = null;

        let wakeLock = null;
        async function requestWakeLock() { try { if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); } } catch (err) {} }

        const dCanvas = document.getElementById('display_canvas'); const dCtx = dCanvas.getContext('2d');
        const drawLayer = document.getElementById('draw_layer'); const drawCtx = drawLayer.getContext('2d');
        const CANVAS_W = 720; const CANVAS_H = 1280;
        dCanvas.width = CANVAS_W; dCanvas.height = CANVAS_H; drawLayer.width = CANVAS_W; drawLayer.height = CANVAS_H;
        drawCtx.strokeStyle = '#FF3366'; drawCtx.lineWidth = 18; drawCtx.lineCap = 'round'; drawCtx.lineJoin = 'round'; drawCtx.shadowColor = '#FF3366'; drawCtx.shadowBlur = 5;

        let hwWriter; let hwCanvas;
        function initHanziWriter() { 
            hwWriter = HanziWriter.create('hw-container', targetWord.char, { 
                width: 400, height: 400, padding: 10, strokeColor: '#FFEA00', radicalColor: '#FF3366', 
                strokeAnimationSpeed: 0.5, delayBetweenStrokes: 150, renderer: 'canvas' 
            }); 
            hwCanvas = document.querySelector('#hw-container canvas'); 
        }

        const screens = { start: document.getElementById('screen-start'), hud: document.getElementById('screen-hud'), result: document.getElementById('screen-result') };
        function showScreen(name) { Object.values(screens).forEach(s => s.classList.remove('active')); screens[name].classList.add('active'); }

        let gamePhase = 'init'; let phaseTimer = 0; let internalTimer;
        let isBuffering = false; let isRetrying = false; let isAborting = false;
        let mediaRecorder; let recordedChunks =[]; let finalVideoFile = null;
        const video = document.getElementById('input_video');

        // ==== 切出后台急救机制 ====
        document.addEventListener("visibilitychange", () => {
            if (document.hidden && (gamePhase === 'memorize' || gamePhase === 'draw')) {
                isAborting = true;
                if(mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
                location.reload(); // 强行重置，保命
            }
        });

        async function selectDifficulty(level) {
            currentDifficulty = level;
            document.getElementById('difficulty-buttons').style.display = 'none';
            document.getElementById('loading-text').style.display = 'block';
            
            const list = hanziDict[level];
            targetWord = list[Math.floor(Math.random() * list.length)];

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }, audio: true });
                video.srcObject = stream; await new Promise(resolve => video.onloadedmetadata = resolve); video.play();
                requestWakeLock(); initHanziWriter(); initMediaPipe();   
            } catch (err) { alert("Camera access is required!"); location.reload(); }
        }

        function setupMediaRecorder() {
            const canvasStream = dCanvas.captureStream(30); const audioTrack = video.srcObject.getAudioTracks()[0];
            const combinedStream = new MediaStream([...canvasStream.getTracks(), audioTrack]);
            let mimeType = 'video/mp4'; if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';
            mediaRecorder = new MediaRecorder(combinedStream, { mimeType: mimeType });
            
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0 && !isRetrying && !isAborting) recordedChunks.push(e.data); };
            mediaRecorder.onstop = () => { if (!isRetrying && !isAborting) showResults(); };
        }

        function startMemorizePhase() {
            showScreen('hud');
            gamePhase = 'memorize'; isBuffering = false;
            document.getElementById('action-bar').classList.add('hidden');
            document.getElementById('pinch-status').classList.add('hidden');

            hwWriter.animateCharacter({
                onComplete: function() {
                    isBuffering = true;
                    // 缓冲2秒再开考
                    setTimeout(() => { if (gamePhase === 'memorize') startDrawPhase(); }, 2000);
                }
            });
        }

        function startDrawPhase() {
            gamePhase = 'draw'; phaseTimer = 40.0;
            document.getElementById('action-bar').classList.remove('hidden');
            document.getElementById('pinch-status').classList.remove('hidden');
            
            internalTimer = setInterval(() => {
                phaseTimer -= 0.1;
                if (phaseTimer <= 0) finishDrawingEarly();
            }, 100);
        }

        function finishDrawingEarly() { 
            clearInterval(internalTimer); 
            document.getElementById('action-bar').classList.add('hidden'); 
            document.getElementById('pinch-status').classList.add('hidden'); 
            gamePhase = 'react'; 
            
            // 全自动：延时 1.5 秒抓拍反应，然后自然关停
            setTimeout(() => {
                gamePhase = 'done';
                if(mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
                if (wakeLock !== null) wakeLock.release().then(() => wakeLock = null);
            }, 1500);
        }

        // ==== 无缝重开机制 ====
        function retryCurrentLevel() {
            isRetrying = true;
            clearInterval(internalTimer);
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            
            drawCtx.clearRect(0, 0, CANVAS_W, CANVAS_H);
            document.getElementById('hw-container').innerHTML = '';
            
            const list = hanziDict[currentDifficulty];
            targetWord = list[Math.floor(Math.random() * list.length)];
            initHanziWriter();
            
            let checkInactive = setInterval(() => {
                if (mediaRecorder.state === 'inactive') {
                    clearInterval(checkInactive);
                    isRetrying = false;
                    recordedChunks =[];
                    mediaRecorder.start();
                    startMemorizePhase();
                }
            }, 50);
        }

        function showResults() {
            showScreen('result');
            const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
            const ext = mediaRecorder.mimeType.includes('mp4') ? 'mp4' : 'webm';
            finalVideoFile = new File([blob], `AirHanzi_Challenge.${ext}`, { type: blob.type });
            const videoURL = URL.createObjectURL(blob);
            const replayVid = document.getElementById('replay-video'); replayVid.src = videoURL; replayVid.play();
        }

        async function shareVideo() {
            if (navigator.share && navigator.canShare && navigator.canShare({ files: [finalVideoFile] })) {
                try { await navigator.share({ title: 'Air-Hanzi Challenge', text: 'Check out my Chinese drawing skills!', files: [finalVideoFile] }); } catch (err) { console.log(err); }
            } else { const a = document.createElement('a'); a.href = URL.createObjectURL(finalVideoFile); a.download = finalVideoFile.name; a.click(); }
        }

        let isAppStarted = false; let wasPinching = false; let smoothX = 0, smoothY = 0; const LERP_FACTOR = 0.5; 
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults(onResults);

        function initMediaPipe() { async function processFrame() { if(!video.paused && !video.ended) await hands.send({image: video}); requestAnimationFrame(processFrame); } processFrame(); }

        function onResults(results) {
            if(!isAppStarted) { 
                isAppStarted = true; 
                setupMediaRecorder(); 
                mediaRecorder.start(); 
                startMemorizePhase(); 
            }
            
            const cW = CANVAS_W; const cH = CANVAS_H; const vW = video.videoWidth; const vH = video.videoHeight;
            dCtx.save();
            const cRatio = cW / cH; const vRatio = vW / vH; let sW = vW, sH = vH, sX = 0, sY = 0;
            if (cRatio > vRatio) { sH = sW / cRatio; sY = (vH - sH) / 2; } else { sW = sH * cRatio; sX = (vW - sW) / 2; }
            dCtx.scale(-1, 1); dCtx.translate(-cW, 0); dCtx.drawImage(results.image, sX, sY, sW, sH, 0, 0, cW, cH); dCtx.restore();

            dCtx.save();
            if (gamePhase === 'memorize') {
                if (hwCanvas) dCtx.drawImage(hwCanvas, cW/2 - 200, cH/2 - 250, 400, 400);
                
                dCtx.fillStyle = '#FFEA00'; dCtx.font = '900 35px Arial'; dCtx.lineWidth = 6; dCtx.strokeStyle = '#000';
                dCtx.strokeText(`"${targetWord.hint}"`, cW/2, cH/2 + 250); dCtx.fillText(`"${targetWord.hint}"`, cW/2, cH/2 + 250);

                if (isBuffering) {
                    dCtx.fillStyle = '#FF3366'; dCtx.font = '900 60px Arial';
                    dCtx.strokeText("GET READY...", cW/2, cH/2 + 350); dCtx.fillText("GET READY...", cW/2, cH/2 + 350);
                } else {
                    dCtx.fillStyle = '#fff'; dCtx.font = '900 40px Arial';
                    dCtx.strokeText("WATCH & MEMORIZE", cW/2, cH/2 + 350); dCtx.fillText("WATCH & MEMORIZE", cW/2, cH/2 + 350);
                }
            } else if (gamePhase === 'draw') {
                dCtx.fillStyle = '#fff'; dCtx.font = '900 100px Arial'; dCtx.textAlign = 'center'; dCtx.lineWidth = 10; dCtx.strokeStyle = '#000'; 
                dCtx.strokeText(phaseTimer.toFixed(1), cW/2, 160); dCtx.fillText(phaseTimer.toFixed(1), cW/2, 160);
            } else if (gamePhase === 'react') {
                dCtx.fillStyle = 'rgba(0,0,0,0.7)'; dCtx.fillRect(20, 100, 220, 260); 
                dCtx.fillStyle = '#FFEA00'; dCtx.font = '900 24px Arial'; dCtx.textAlign = 'left'; 
                dCtx.fillText('EXPECTATION:', 40, 140);
                dCtx.fillStyle = '#fff'; dCtx.font = '900 140px "SimHei"'; 
                dCtx.fillText(targetWord.char, 60, 300);
            }
            dCtx.restore();

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const hand = results.multiHandLandmarks[0];
                const indexTip = hand[8]; const thumbTip = hand[4]; const indexBase = hand[5]; const pinkyBase = hand[17];
                
                const rawX = cW - (((indexTip.x * vW - sX) / sW) * cW); const rawY = ((indexTip.y * vH - sY) / sH) * cH;
                
                if (smoothX === 0) { smoothX = rawX; smoothY = rawY; }
                smoothX = smoothX + (rawX - smoothX) * LERP_FACTOR; smoothY = smoothY + (rawY - smoothY) * LERP_FACTOR;

                const palmWidth = Math.hypot(indexBase.x - pinkyBase.x, indexBase.y - pinkyBase.y);
                const pinchDist = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y);
                const pinchRatio = palmWidth > 0 ? pinchDist / palmWidth : 1;
                
                let isPinching = wasPinching;
                if (!wasPinching && pinchRatio < 0.28) { isPinching = true; } else if (wasPinching && pinchRatio > 0.45) { isPinching = false; } 

                if (gamePhase === 'draw') {
                    const pinchStatusDom = document.getElementById('pinch-status');
                    if (isPinching) {
                        pinchStatusDom.innerText = "✍️ DRAWING...";
                        pinchStatusDom.className = "absolute top-16 left-1/2 transform -translate-x-1/2 bg-red-500 text-white px-5 py-2 rounded-full font-black text-lg z-50 shadow-lg";
                        if (!wasPinching) { drawCtx.beginPath(); drawCtx.moveTo(smoothX, smoothY); } else { drawCtx.lineTo(smoothX, smoothY); drawCtx.stroke(); } 
                    } else {
                        pinchStatusDom.innerText = "🤏 PINCH TO DRAW";
                        pinchStatusDom.className = "absolute top-16 left-1/2 transform -translate-x-1/2 bg-black/60 text-white px-5 py-2 rounded-full font-black text-lg z-50 backdrop-blur-sm";
                    }
                }
                wasPinching = isPinching;
                
                if (gamePhase === 'draw' || gamePhase === 'memorize') {
                    dCtx.beginPath(); dCtx.arc(smoothX, smoothY, 12, 0, 2*Math.PI);
                    dCtx.fillStyle = isPinching ? '#FF3366' : '#FFEA00'; dCtx.fill(); dCtx.lineWidth = 4; dCtx.strokeStyle = '#000'; dCtx.stroke();
                }
            } else { wasPinching = false; }
            dCtx.drawImage(drawLayer, 0, 0); 
        }
    </script>
</body>
</html>
