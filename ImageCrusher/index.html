<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEB 1.0 IMAGE CRUSHER</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #00ff41;
            --panel-bg: #111;
            --border-style: 2px solid #00ff41;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'VT323', monospace; 
            font-size: 18px;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            height: 100%;
            overflow-y: auto;
        }

        h1 {
            text-transform: uppercase;
            border-bottom: var(--border-style);
            padding-bottom: 10px;
            margin: 10px 0 20px 0;
            font-size: 2rem;
            letter-spacing: 2px;
            text-shadow: 3px 3px 0px #ff0000;
            text-align: center;
            width: 100%;
        }

        .container {
            display: flex;
            flex-wrap: wrap; 
            gap: 15px;
            width: 100%;
            justify-content: center;
            max-width: 1200px;
        }

        /* 预览区域：左/上 */
        .preview-section {
            flex: 2;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: var(--border-style);
            padding: 10px;
            background: #0a0a0a;
            overflow: hidden;
            min-height: 400px; 
            cursor: pointer;
            position: relative;
            transition: background 0.3s;
        }

        .preview-section:hover {
            background: #151515;
            box-shadow: inset 0 0 20px rgba(0, 255, 65, 0.1);
        }

        /* 控制面板：右/下 */
        .controls-section {
            border: var(--border-style);
            background: var(--panel-bg);
            padding: 20px;
            flex: 1;
            min-width: 280px;
            height: fit-content;
        }

        #imageInput { display: none; }

        canvas {
            max-width: 100%;
            max-height: 600px; 
            height: auto;
            image-rendering: pixelated; 
            image-rendering: crisp-edges;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.2);
            pointer-events: none; 
        }

        .placeholder-text {
            text-align: center;
            pointer-events: none;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .control-group { margin-bottom: 20px; }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 1.2rem;
            display: flex;
            justify-content: space-between;
        }

        input[type="range"] {
            width: 100%;
            background: transparent;
            -webkit-appearance: none;
            border: 1px solid #333;
            height: 15px;
            margin-top: 5px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            background: var(--text-color);
            height: 15px;
            width: 15px;
            cursor: pointer;
            box-shadow: 1px 1px 0 #000;
        }

        button {
            background-color: var(--text-color);
            color: black;
            border: none;
            padding: 15px 20px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 1.3rem;
            width: 100%;
            margin-top: 20px;
            box-shadow: 4px 4px 0px #555;
            transition: transform 0.1s;
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #555;
        }
        
        button:hover {
            background-color: #fff;
        }

        .value-display { color: #ff0000; }
        .glitch-text { font-size: 0.9rem; color: #666; margin-top: 4px; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #00ff41; }
    </style>
</head>
<body>

    <h1>Web 1.0 Image Crusher</h1>

    <input type="file" id="imageInput" accept="image/*">

    <div class="container">
        
        <!-- 1. 预览区域 / 上传按钮 -->
        <div class="preview-section" id="dropZone">
            <canvas id="canvas" style="display:none;"></canvas>
            <div id="placeholder" class="placeholder-text">
                <div style="font-size: 3rem; margin-bottom: 10px;">+</div>
                <div>CLICK TO UPLOAD IMAGE</div>
                <div style="font-size: 0.8em; color:#666; margin-top:5px;">OR DROP FILE HERE</div>
            </div>
        </div>

        <!-- 2. 控制面板 -->
        <div class="controls-section">
            <div class="control-group">
                <label>PIXELATION <span id="val-pixel" class="value-display">0%</span></label>
                <!-- 修改：从0开始，0代表无效果 -->
                <input type="range" id="pixelation" min="0" max="98" value="0">
            </div>

            <div class="control-group">
                <!-- 修改：更通俗的名字 "MOLD LEVEL" (电子包浆等级) -->
                <label>MOLD LEVEL <span id="val-quality" class="value-display">0%</span></label>
                <input type="range" id="jpegQuality" min="0" max="95" value="0">
            </div>

            <div class="control-group">
                <label>DEEP FRY <span id="val-fry" class="value-display">1</span></label>
                <input type="range" id="saturation" min="1" max="50" value="1">
            </div>

            <div class="control-group">
                <label>CONTRAST <span id="val-contrast" class="value-display">1</span></label>
                <input type="range" id="contrast" min="1" max="50" value="1">
            </div>

            <div class="control-group">
                <label>NOISE <span id="val-noise" class="value-display">0</span></label>
                <input type="range" id="noise" min="0" max="100" value="0">
            </div>

            <button id="downloadBtn">SAVE IMAGE</button>
        </div>
    </div>
<script>
        const imageInput = document.getElementById('imageInput');
        const dropZone = document.getElementById('dropZone');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const placeholder = document.getElementById('placeholder');
        const downloadBtn = document.getElementById('downloadBtn');
        
        const inputs = {
            pixel: document.getElementById('pixelation'),
            quality: document.getElementById('jpegQuality'),
            sat: document.getElementById('saturation'),
            con: document.getElementById('contrast'),
            noise: document.getElementById('noise')
        };

        // 核心变量
        let sourceCanvas = document.createElement('canvas'); // 用于存储缩放后的原图
        let srcCtx = sourceCanvas.getContext('2d');
        let isImageLoaded = false;

        // 交互逻辑
        dropZone.addEventListener('click', () => imageInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.background = '#222';
        });
        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.style.background = '#0a0a0a';
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.background = '#0a0a0a';
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        imageInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                handleFile(e.target.files[0]);
            }
        });

        // iOS 优化：使用 input 和 change 混合监听，确保拖动滑块时尽可能流畅，松手时彻底渲染
        Object.values(inputs).forEach(input => {
            input.addEventListener('input', updateValues); // 更新数字显示
            input.addEventListener('change', processImage); // 松手时渲染 (最稳)
            // input.addEventListener('input', processImage); // 如果手机不卡，可以解开这行实现实时渲染
        });
        
        downloadBtn.addEventListener('click', downloadImage);

        function updateValues() {
            document.getElementById('val-pixel').innerText = inputs.pixel.value + '%';
            document.getElementById('val-quality').innerText = inputs.quality.value + '%';
            document.getElementById('val-fry').innerText = inputs.sat.value;
            document.getElementById('val-contrast').innerText = inputs.con.value;
            document.getElementById('val-noise').innerText = inputs.noise.value;
        }

        function handleFile(file) {
            if (!file.type.startsWith('image/')) return;
            
            const reader = new FileReader();
            reader.onload = function(event) {
                let img = new Image();
                img.onload = function() {
                    // --- iOS 核心修复：限制最大分辨率 ---
                    // 如果图片大于 1200px，强制压缩。这解决了内存崩溃和像素化不明显的问题
                    const maxDim = 1200; 
                    let width = img.width;
                    let height = img.height;

                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height *= maxDim / width;
                            width = maxDim;
                        } else {
                            width *= maxDim / height;
                            height = maxDim;
                        }
                    }

                    // 1. 将处理好的尺寸存入 sourceCanvas (作为唯一的真·原图)
                    sourceCanvas.width = width;
                    sourceCanvas.height = height;
                    srcCtx.drawImage(img, 0, 0, width, height);

                    // 2. 设置显示用的 canvas 尺寸
                    canvas.width = width;
                    canvas.height = height;

                    // 3. UI 更新
                    placeholder.style.display = 'none';
                    canvas.style.display = 'block';
                    isImageLoaded = true;
                    
                    // 4. 初始渲染
                    processImage();
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }

        function processImage() {
            if (!isImageLoaded) return;

            // 获取参数
            let pixelSliderVal = parseInt(inputs.pixel.value);
            // 优化逻辑：给像素化一个非线性的感觉，效果更好
            const pixelRatio = (100 - pixelSliderVal) / 100;

            let qualitySliderVal = parseInt(inputs.quality.value);
            let quality = (100 - qualitySliderVal) / 100;
            if (quality <= 0) quality = 0.01;

            const saturate = inputs.sat.value;
            const contrast = inputs.con.value;
            const noiseLevel = parseInt(inputs.noise.value);

            const w = sourceCanvas.width;
            const h = sourceCanvas.height;

            // 计算缩小后的尺寸 (最少1像素)
            const scaledW = Math.max(1, Math.floor(w * pixelRatio));
            const scaledH = Math.max(1, Math.floor(h * pixelRatio));

            // 创建临时 Canvas 进行像素处理
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = scaledW;
            tempCanvas.height = scaledH;

            // --- iOS 兼容性修复：不仅是 standard，还要加上 webkit 前缀 ---
            tempCtx.imageSmoothingEnabled = false;
            tempCtx.webkitImageSmoothingEnabled = false;
            tempCtx.mozImageSmoothingEnabled = false;
            tempCtx.msImageSmoothingEnabled = false;

            // 1. 滤镜 + 缩小 (Downscale)
            tempCtx.filter = `saturate(${saturate}) contrast(${contrast})`;
            tempCtx.drawImage(sourceCanvas, 0, 0, scaledW, scaledH);
            
            // 2. 加噪点 (在小图上加，放大后才有颗粒感)
            if (noiseLevel > 0) {
                const imageData = tempCtx.getImageData(0, 0, scaledW, scaledH);
                const data = imageData.data;
                for (let i = 0; i < data.length; i += 4) {
                    // 简单的噪点算法
                    const random = (0.5 - Math.random()) * (noiseLevel * 5);
                    data[i] += random;
                    data[i+1] += random;
                    data[i+2] += random;
                }
                tempCtx.putImageData(imageData, 0, 0);
            }

            // 3. 放大回主 Canvas (Upscale)
            canvas.width = w;
            canvas.height = h;
            
            ctx.imageSmoothingEnabled = false;
            ctx.webkitImageSmoothingEnabled = false;
            ctx.mozImageSmoothingEnabled = false;
            
            // 关键：把小图画大
            ctx.drawImage(tempCanvas, 0, 0, scaledW, scaledH, 0, 0, w, h);

            // 4. 电子包浆 (JPEG Artifacts)
            // iOS 上 toDataURL 有时会忽略 quality 参数，如果图太大。
            // 但因为我们在 handleFile 里已经限制了尺寸，这里生效的概率大大增加。
            if (quality < 1) {
                // 这是一个异步操作，可能会导致闪烁，但在手机上为了效果必须这么做
                const jpegDataUrl = canvas.toDataURL('image/jpeg', quality);
                const compressedImg = new Image();
                compressedImg.onload = function() {
                    // 再次关闭平滑，防止绘制 JPEG 时变糊
                    ctx.imageSmoothingEnabled = false;
                    ctx.webkitImageSmoothingEnabled = false;
                    ctx.drawImage(compressedImg, 0, 0);
                };
                compressedImg.src = jpegDataUrl;
            }
        }

        function downloadImage() {
            if (!isImageLoaded) return;
            const link = document.createElement('a');
            link.download = 'crushed_meme_' + Date.now() + '.jpg';
            link.href = canvas.toDataURL('image/jpeg', 0.8); 
            link.click();
        }
    </script>
   
</body>
</html>
